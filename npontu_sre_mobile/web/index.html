<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Opsora SRE - Site Reliability Engineering & Operations Platform. Real-time shift execution, dual handovers, and war rooms.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Opsora SRE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Opsora SRE</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #07100B;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .opsora-preloader {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .opsora-emblem {
      width: 72px;
      height: 72px;
      animation: opsoraPulse 1.8s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 16px rgba(27, 107, 58, 0.6));
    }
    @keyframes opsoraPulse {
      0% { transform: scale(0.96); opacity: 0.85; filter: drop-shadow(0 0 12px rgba(27, 107, 58, 0.4)); }
      100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 24px rgba(245, 197, 24, 0.5)); }
    }
    .opsora-title {
      margin-top: 18px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
    }
    .opsora-subtitle {
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #A0AEC0;
    }
    .opsora-bar {
      margin-top: 20px;
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .opsora-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #1B6B3A, #F5C518);
      border-radius: 3px;
      animation: opsoraSlide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes opsoraSlide {
      0% { left: -40%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="opsora-preloader" id="opsora-preloader">
    <svg class="opsora-emblem" viewBox="0 0 100 100" fill="none">
      <path d="M50 4 L92 27 L92 73 L50 96 L8 73 L8 27 Z" fill="#1B6B3A" stroke="#F5C518" stroke-width="3.5" stroke-opacity="0.8"/>
      <path d="M28 50 C28 38, 40 35, 50 50 C60 65, 72 62, 72 50 C72 38, 60 35, 50 50 C40 65, 28 62, 28 50 Z" fill="none" stroke="#F5C518" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="5" fill="#FFFFFF"/>
    </svg>
    <div class="opsora-title">Opsora SRE</div>
    <div class="opsora-subtitle">Site Reliability Cockpit</div>
    <div class="opsora-bar"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
