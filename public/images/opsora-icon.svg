<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="opsoraShieldGradSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#248A4B"/>
      <stop offset="60%" stop-color="#1B6B3A"/>
      <stop offset="100%" stop-color="#0F3B20"/>
    </linearGradient>
    <linearGradient id="opsoraGoldGradSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#D9A807"/>
    </linearGradient>
    <filter id="goldGlowSq" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal Boundary / Shield -->
  <path d="M50 4 L92 27 L92 73 L50 96 L8 73 L8 27 Z"
        fill="url(#opsoraShieldGradSq)"
        stroke="#F5C518"
        stroke-width="3"
        stroke-opacity="0.6"
        stroke-linejoin="round"/>

  <!-- Inner precision line -->
  <path d="M50 11 L86 31 L86 69 L50 89 L14 69 L14 31 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.2"
        stroke-opacity="0.15"/>

  <!-- Infinity / 24-7 Circular Handover Loop -->
  <path d="M28 50 C28 38, 40 35, 50 50 C60 65, 72 62, 72 50 C72 38, 60 35, 50 50 C40 65, 28 62, 28 50 Z"
        fill="none"
        stroke="url(#opsoraGoldGradSq)"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#goldGlowSq)"/>

  <!-- Pulse Vertices -->
  <circle cx="28" cy="50" r="5.5" fill="#FFFFFF" stroke="#1B6B3A" stroke-width="2.5"/>
  <circle cx="72" cy="50" r="5.5" fill="#FFFFFF" stroke="#1B6B3A" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="6" fill="#F5C518" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Cardinal Telemetry Rays -->
  <circle cx="50" cy="22" r="3" fill="#F5C518"/>
  <circle cx="50" cy="78" r="3" fill="#F5C518"/>
  <line x1="50" y1="27" x2="50" y2="40" stroke="#F5C518" stroke-width="1.8" stroke-dasharray="2 2" opacity="0.8"/>
  <line x1="50" y1="60" x2="50" y2="73" stroke="#F5C518" stroke-width="1.8" stroke-dasharray="2 2" opacity="0.8"/>
</svg>
