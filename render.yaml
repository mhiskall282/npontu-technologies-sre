# ─────────────────────────────────────────────────────────────────────────────
# Opsora SRE SaaS Platform — Render Infrastructure Blueprint (render.yaml)
# https://render.com/docs/infrastructure-as-code
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── 1. Web Service (Docker Runtime: Apache + PHP 8.2 + Node 20 Assets) ──────
  - type: web
    name: opsora-sre
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Opsora SRE"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://opsora-sre.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_EXPIRE_ON_CLOSE
        value: "false"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: opsora-db
          property: connectionString

  # ── 2. Background Queue Worker (Automated SRE Alerts & Inbound Mail) ────────
  - type: worker
    name: opsora-sre-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan queue:work --tries=3 --timeout=90 --verbose
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Opsora SRE"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        fromService:
          type: web
          name: opsora-sre
          envVarKey: APP_KEY
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: opsora-db
          property: connectionString

  # ── 3. Cron Scheduler (Automated Daily Reports & Incident SLO Escalations) ──
  - type: cron
    name: opsora-sre-scheduler
    runtime: docker
    plan: starter
    schedule: "* * * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan schedule:run
    envVars:
      - key: APP_NAME
        value: "Opsora SRE"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        fromService:
          type: web
          name: opsora-sre
          envVarKey: APP_KEY
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: opsora-db
          property: connectionString

# ── 4. Managed Relational Database (PostgreSQL 16) ───────────────────────────
databases:
  - name: opsora-db
    databaseName: opsora_sre
    user: opsora_admin
    plan: starter
