services:
  # ── 1. Web Service (Docker Runtime - Free Tier Compatible) ───────────────
  - type: web
    name: npontu-support-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: "15"
      - key: SESSION_EXPIRE_ON_CLOSE
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: npontu-db
          property: connectionString
    customDomains:
      - npontu-tracker.johnokyere.xyz

  # ── 2. Database Service (Render Free PostgreSQL) ─────────────────────────
databases:
  - name: npontu-db
    databaseName: npontu_tracker
    user: npontu_user
    plan: free
