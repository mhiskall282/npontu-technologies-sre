name: Mobile CI (Flutter Android & iOS)

on:
  push:
    branches: [ main ]
    paths:
      - 'npontu_sre_mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'npontu_sre_mobile/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

env:
  API_BASE_URL: https://npontu-support-tracker.onrender.com/api/v1

jobs:
  flutter-test-and-build:
    name: Flutter Lint, Test & Android Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: npontu_sre_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: flutter analyze

      - name: Run Unit and Widget Tests
        run: flutter test --coverage

      # ── Android Debug (fast feedback) ─────────────────────────────────────
      # Debug build uses --split-per-abi too to keep CI artifact sizes sane.
      - name: Build Android Debug APK (arm64)
        run: |
          flutter build apk \
            --debug \
            --split-per-abi \
            --target-platform android-arm64 \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      # ── Android Release — Per-ABI Split APKs ─────────────────────────────
      # --split-per-abi: produces one APK per ABI (~35-55 MB each).
      # --obfuscate: removes Dart symbol names from the binary.
      # --split-debug-info: writes symbols to a side-car dir (needed for crash reporting).
      # Without --split-per-abi, Flutter produces a fat APK of ~150-160 MB.
      - name: Build Android Release APKs (split per ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      # ── Android Release — Universal Fat APK (Runs on all devices & emulators) ───
      - name: Build Android Universal Release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      # ── Android App Bundle (Google Play) ─────────────────────────────────
      # AAB is the preferred distribution format. Play splits per device automatically,
      # so users download only the ABI + language + density slice they need (~15-25 MB).
      - name: Build Android Release App Bundle (.aab)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      # ── Artifacts ─────────────────────────────────────────────────────────

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: npontu-sre-universal-release-apk
          path: npontu_sre_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Split APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npontu-sre-android-split-apks
          # Split APKs land in flutter-apk/ named by ABI:
          # app-arm64-v8a-release.apk, app-armeabi-v7a-release.apk, etc.
          path: npontu_sre_mobile/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: npontu-sre-google-play-aab
          path: npontu_sre_mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug Symbols (for crash deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: npontu-sre-debug-symbols
          path: npontu_sre_mobile/build/debug-info/
          if-no-files-found: warn
          retention-days: 30
